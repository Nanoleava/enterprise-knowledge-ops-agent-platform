spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ljl_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.ljl.agent.entity
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL

logging:
  level:
    # MyBatis DEBUG 会连同参数输出密码摘要和完整正文，因此阶段 2 默认关闭参数级 SQL 日志。
    com.ljl.agent.mapper: info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
